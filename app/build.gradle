plugins {
    id 'com.android.application'
}

android {
    namespace 'dummydomain.yetanothercallblocker'
    compileSdk 36

    defaultConfig {
        applicationId "de.itmanpapa.callblocker"
        minSdk 26
        targetSdk 36
        versionCode 10000
        versionName "0.10.0"

        javaCompileOptions {
            annotationProcessorOptions {
                arguments = [eventBusIndex: 'dummydomain.yetanothercallblocker.EventBusIndex']
            }
        }
    }

    // Release signing is configured only when the keystore is provided via environment
    // variables (see .github/workflows/release.yml); otherwise the release APK is unsigned.
    def releaseKeystore = System.getenv("SIGNING_KEYSTORE_PATH")
    if (releaseKeystore) {
        signingConfigs {
            release {
                storeFile file(releaseKeystore)
                storePassword System.getenv("SIGNING_KEYSTORE_PASSWORD")
                keyAlias System.getenv("SIGNING_KEY_ALIAS")
                keyPassword System.getenv("SIGNING_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (releaseKeystore) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig true
        resValues true
    }

    applicationVariants.configureEach { variant ->
        variant.resValue "string", "app_id", variant.applicationId
    }

    lint {
        lintConfig file("lint.xml")
        abortOnError false
    }
}

dependencies {
    def eventbus_version = '3.3.1'

    implementation 'org.slf4j:slf4j-api:1.7.36'
    runtimeOnly 'com.github.tony19:logback-android:2.0.0'
    implementation 'org.conscrypt:conscrypt-android:2.5.2'
    implementation 'com.squareup.okhttp3:okhttp:3.12.13'
    implementation 'com.gitlab.xynngh:LibPhoneNumberInfo:c77bdd2b69'
    implementation 'org.apache.commons:commons-csv:1.8'

    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.recyclerview:recyclerview-selection:1.1.0'
    implementation 'androidx.paging:paging-runtime:2.1.2'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'androidx.work:work-runtime:2.9.1'
    implementation 'org.greenrobot:greendao:3.3.0'
    implementation "org.greenrobot:eventbus:$eventbus_version"
    annotationProcessor "org.greenrobot:eventbus-annotation-processor:$eventbus_version"

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'com.squareup.okhttp3:mockwebserver:3.12.13'
}
