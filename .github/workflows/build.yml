name: Build

on:
  push:
    branches: [ '**' ]
    tags-ignore: [ '**' ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      # fails on malformed XML, duplicate names and placeholder mismatches;
      # missing translations are only reported
      - name: Check translations
        run: python3 .github/scripts/check_translations.py

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v5

      # both flavors: "github" (our releases, with the self-updater) and "fdroid"
      # (F-Droid/IzzyOnDroid, without it)
      - name: Build debug APKs
        run: ./gradlew --no-daemon assembleGithubDebug assembleFdroidDebug

      - name: Unit tests
        run: ./gradlew --no-daemon testGithubDebugUnitTest

      - name: Lint
        run: ./gradlew --no-daemon lintGithubDebug lintFdroidDebug

      - uses: actions/upload-artifact@v5
        with:
          name: app-debug
          path: app/build/outputs/apk/*/debug/*.apk

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: lint-report
          path: app/build/reports/lint-results-*Debug.html
          if-no-files-found: ignore
