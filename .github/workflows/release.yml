name: Release

on:
  push:
    tags: [ 'v*' ]
  # publishing a draft release does not always fire the tag push event
  release:
    types: [ published ]
  # "Run workflow" (also from a phone): without inputs it releases the version
  # from app/build.gradle of the selected branch, creating the tag and the release
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release name/tag, e.g. v0.10.0 (empty: v + versionName from app/build.gradle); the code is taken from the selected branch'
        required: false
      ref:
        description: 'Optional branch/commit to build instead of the tag'
        required: false

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.event.release.tag_name || github.ref_name }}

env:
  REQUESTED_TAG: ${{ inputs.tag || github.event.release.tag_name || (github.event_name == 'push' && github.ref_name || '') }}

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          # manual runs build the selected branch (the tag may not exist yet);
          # tag pushes and published releases build the tag
          ref: ${{ inputs.ref || (github.event_name == 'workflow_dispatch' && github.ref) || github.event.release.tag_name || github.ref }}

      - name: Determine the release tag
        run: |
          tag="$REQUESTED_TAG"
          if [ -z "$tag" ]; then
            version=$(sed -n 's/.*versionName "\([^"]*\)".*/\1/p' app/build.gradle | head -1)
            if [ -z "$version" ]; then
              echo "::error::versionName not found in app/build.gradle"
              exit 1
            fi
            tag="v$version"
          fi
          echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"
          echo "Releasing $tag"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v5

      - name: Decode signing keystore
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "::error::Secret SIGNING_KEYSTORE_BASE64 is not set"
            exit 1
          fi
          echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build signed release APK
        env:
          SIGNING_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease

      - name: Rename APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/callguard-${RELEASE_TAG}.apk"

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          files: dist/*.apk
          generate_release_notes: true
