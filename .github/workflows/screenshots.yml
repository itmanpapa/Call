name: Screenshots

on:
  workflow_dispatch:
  push:
    branches: [ 'claude/**' ]
    paths:
      - 'app/src/main/res/**'
      - 'app/src/main/java/**'
      - '.github/scripts/screenshots.sh'
      - '.github/workflows/screenshots.yml'

permissions:
  contents: write

jobs:
  screenshots:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v5

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run emulator and capture screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: ./.github/scripts/screenshots.sh

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: screenshots
          path: screenshots/

      - name: Commit screenshots to docs/screenshots
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/heads/claude/')
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick >/dev/null
          mkdir -p docs/screenshots
          rm -f docs/screenshots/*.png
          for f in screenshots/*.png; do
            convert "$f" -resize 540x "docs/screenshots/$(basename "$f")"
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Скриншоты для ${GITHUB_SHA::7} [skip ci]"
          for i in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep 5
          done
          exit 1
